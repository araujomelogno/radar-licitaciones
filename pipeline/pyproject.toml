[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "radar"
version = "1.0.0"
description = "Radar de licitaciones de Equipos Consultores: collectors, pipeline y clasificación"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "lxml>=5.2",
  "feedparser>=6.0",
  "pydantic>=2.7",
  "python-dateutil>=2.9",
  "google-cloud-firestore>=2.16",
  "google-cloud-storage>=2.16",
  "google-auth>=2.29",
  "google-genai>=1.0",
  "firebase-admin>=6.5",
]

[project.optional-dependencies]
navegador = ["playwright>=1.44"]
dev = ["pytest>=8", "ruff>=0.5", "respx>=0.21"]

[tool.setuptools.packages.find]
include = ["radar*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
